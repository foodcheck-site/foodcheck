<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodCheck — is anything in my kitchen recalled?</title>
<meta name="description" content="Check active US food recalls by state, product, or barcode. Plain answers, honest about what the data can't tell you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: '#FFFFFF',
          ink: '#1B1F24',
          stamp: '#B3261E',
          ochre: '#8A5A00',
          slate: '#4A5568',
          inspection: '#1D4ED8',
          stock: '#E6E9ED',
          stockdeep: '#D9DEE5',
        },
        fontFamily: {
          display: ['Archivo', 'system-ui', 'sans-serif'],
          body: ['"Public Sans"', 'system-ui', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'ui-monospace', 'Menlo', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html { background: #FFFFFF; color: #1B1F24; }
  body { font-family: "Public Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Focus: visible everywhere, never removed. */
  :focus-visible { outline: 3px solid #1D4ED8; outline-offset: 2px; }
  /* Severity edges. Shape + weight differ so color is never the only signal. */
  .edge-1 { border-left: 12px solid #B3261E; background-image: repeating-linear-gradient(135deg, #B3261E 0 6px, #7A1912 6px 12px); background-size: 12px 100%; background-repeat: no-repeat; background-position: left; }
  .edge-a { border-left: 12px solid #B3261E; }
  .edge-u { border-left: 6px dashed #4A5568; }
  .edge-2 { border-left: 6px double #8A5A00; }
  .edge-3 { border-left: 3px solid #4A5568; }
  /* Blind-spot hatch */
  .hatch { background-image: repeating-linear-gradient(135deg, #D9DEE5 0 4px, #FFFFFF 4px 8px); }
  .hatch-fail { background-image: repeating-linear-gradient(90deg, #B3261E 0 6px, transparent 6px 10px); }
  @media (prefers-reduced-motion: no-preference) {
    .fade-in { animation: fade .25s ease-out both; }
    @keyframes fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body class="font-body text-ink bg-paper" data-feedback-email="foodcheck@duck.com" data-donate-url="">
<div id="root"><p style="padding:1rem;color:#4A5568">Loading FoodCheck…</p></div>
<script>
  // If anything fails before React draws, say so on the page instead of leaving it blank.
  window.addEventListener('error', function (e) {
    var root = document.getElementById('root');
    if (root && !root.dataset.started) root.innerHTML = '<div style="padding:1rem;font-family:system-ui;max-width:42rem"><p style="color:#B3261E;font-weight:600">The page couldn\u2019t start.</p><p style="margin-top:.5rem">' + String(e.message || e.error || 'Unknown error') + (e.filename ? ' <span style="color:#4A5568">(' + e.filename.replace(location.origin, '') + ':' + e.lineno + ')</span>' : '') + '</p><p style="margin-top:.5rem;color:#4A5568;font-size:.9rem">Copy this message when reporting the problem. The server window may show more.</p></div>';
  });
  window.addEventListener('unhandledrejection', function (e) { window.dispatchEvent(new ErrorEvent('error', { message: String(e.reason && e.reason.message || e.reason) })); });
</script>
<noscript><p style="padding:1rem;font-family:system-ui">FoodCheck needs JavaScript to check recalls. The underlying sources are at fda.gov and fsis.usda.gov.</p></noscript>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-type="module" data-presets="react" src="./src/app.jsx"></script>
</body>
</html>
